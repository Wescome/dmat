name: build-paper
on:
  push:
    tags: ['paper-v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-publishers texlive-science texlive-fonts-recommended zip
      - name: Build
        run: make release
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            paper/release/dmat-wp-2026-dm-01.pdf
            paper/release/dmat-wp-2026-dm-01-source.zip
